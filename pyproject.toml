[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rbdcap"
version = "0.1.0"
description = "Student prototype: flag possible REM sleep behavior disorder episodes in overnight phone recordings for human review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "mediapipe>=0.10.14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rbdcap = "rbdcap.cli:main"

[tool.setuptools]
packages = ["rbdcap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
